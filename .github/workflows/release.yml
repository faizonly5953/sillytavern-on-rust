# Production release: push a tag that matches package.json, e.g.
#   npm version patch && git push --follow-tags
# Tags with a suffix (v1.2.0-beta.1) become prereleases and never trigger the in-app popup.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # Draft until every asset is uploaded, so apps never see a half-finished release.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        # The GitHub API sometimes answers 5xx even when the release was created,
        # so every call is retried and an existing release for the tag is reused.
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          for i in 1 2 3 4 5; do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $PRERELEASE --verify-tag \
              --title "SillyTavern RS $GITHUB_REF_NAME" --generate-notes && break
            sleep $((i * 5))
          done
          ID=""
          for i in 1 2 3 4 5; do
            ID=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
            [ -n "$ID" ] && break
            sleep $((i * 5))
          done
          if [ -z "$ID" ]; then
            echo "::error::Could not create or find release $GITHUB_REF_NAME"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: pnpm install --frozen-lockfile

      # Builds the NSIS installer, signs it for the updater and uploads latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles nsis
          includeUpdaterJson: true

  android:
    needs: create-release
    # GitHub-hosted by default. To build on your own server instead, register a
    # self-hosted runner labelled "android" (scripts/setup-vps-runner.sh) and set the
    # repository variable ANDROID_RUNNER to ["self-hosted","linux","android"].
    runs-on: ${{ fromJSON(vars.ANDROID_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The SDK is preinstalled on GitHub's Ubuntu images and by the VPS setup script;
      # only the NDK is installed here when missing.
      - name: Android SDK and NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found. Set ANDROID_HOME on the runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          NDK="${NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK  NDK: $NDK"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: pnpm install --frozen-lockfile

      # Same key for every release, otherwise Android refuses to update the app.
      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\npassword=%s\nkeyAlias=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > keystore.properties

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          case "$APK" in
            ""|*unsigned*) echo "::error::No signed release APK found ($APK)"; exit 1 ;;
          esac
          OUT="SillyTavernRS-${GITHUB_REF_NAME#v}-android-arm64.apk"
          cp "$APK" "$OUT"
          for i in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" "$OUT" --clobber && exit 0
            sleep $((i * 5))
          done
          echo "::error::Upload of $OUT failed"
          exit 1

      # Self-hosted runners keep their workspace between jobs; never leave the key behind.
      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/release.jks src-tauri/gen/android/keystore.properties SillyTavernRS-*.apk

  publish:
    needs: [create-release, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="--latest"
          case "$GITHUB_REF_NAME" in *-*) LATEST="--latest=false" ;; esac
          for i in 1 2 3 4 5; do
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false $LATEST && exit 0
            sleep $((i * 5))
          done
          echo "::error::Publishing $GITHUB_REF_NAME failed"
          exit 1
