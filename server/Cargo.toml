[package]
name = "sillytavern-rs-server"
version = "0.2.0"
description = "Self-hosted sync server for SillyTavern RS"
authors = ["Faiz Bagus Pradana"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sillytavern-rs-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
